# Minecraft versions this jar is published for (space separated, oldest first).
# Mod metadata ranges and Modrinth/CurseForge game versions are generated from this list.
mc_targets=26.2
java_version=25

fabric_loader=0.19.5
# Oldest Fabric Loader the jar accepts; the production tests run on it (the GameTests in
# development run on fabric_loader). At least what this target's Fabric API versions require.
fabric_loader_min=0.18.4
fabric_api=0.161.0+26.2

# Other loaders this jar is published for (each needs a versions/<mc>-fabric-<loader> smoke test).
also_runs_on=quilt

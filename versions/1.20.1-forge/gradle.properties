# Minecraft versions this jar is published for (space separated, oldest first).
# Mod metadata ranges and Modrinth/CurseForge game versions are generated from this list.
mc_targets=1.20.1
java_version=17

forge=47.4.26
# Oldest Forge the jar accepts; the production test installs it.
forge_min=47.1.0
pack_format=15

# Other loaders this jar is published for (each needs a versions/<mc>-forge-<loader> smoke test).
also_runs_on=neoforge

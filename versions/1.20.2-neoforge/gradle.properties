# Smoke test: runs the GameTests on Minecraft 1.20.2 with the jar built by 1.20.4-neoforge.
smoke_of=1.20.4-neoforge
java_version=17

# NeoForge version the production tests install.
neoforge_min=20.2.86
# ModDevGradle cannot set up this NeoForge version, so this target only runs the production tests
# (gradle/production.gradle).
production_server=true

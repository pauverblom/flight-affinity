# Minecraft versions this jar is published for (space separated, oldest first).
# Mod metadata ranges and Modrinth/CurseForge game versions are generated from this list.
mc_targets=1.21 1.21.1 1.21.2 1.21.3 1.21.4 1.21.5 1.21.6 1.21.7 1.21.8
java_version=21

fabric_loader=0.19.5
# Oldest Fabric Loader the jar accepts; the production tests run on it (the GameTests in
# development run on fabric_loader). At least what the oldest Minecraft version's Fabric API
# requires; smoke targets of newer versions whose Fabric API needs more set their own.
fabric_loader_min=0.15.11
fabric_api=0.116.17+1.21.1

# Other loaders this jar is published for: each needs a versions/<mc>-fabric-<loader> smoke test for every
# Minecraft version in mc_targets.
also_runs_on=quilt

mc_targets=26.3
java_version=25

neoforge=26.3.0.76
# Oldest NeoForge build tested for this Minecraft version (the production test installs it).
# On the oldest Minecraft version of a jar it is also the lowest NeoForge version the jar accepts.
neoforge_min=26.3.0.76

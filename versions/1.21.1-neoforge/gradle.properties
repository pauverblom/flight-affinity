# Minecraft versions this jar is published for (space separated, oldest first).
# Mod metadata ranges and Modrinth/CurseForge game versions are generated from this list.
mc_targets=1.21 1.21.1
java_version=21

neoforge=21.1.259
# Oldest NeoForge build tested for this Minecraft version (the production test installs it).
# On the oldest Minecraft version of a jar it is also the lowest NeoForge version the jar accepts.
neoforge_min=21.1.1

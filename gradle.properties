# Shared by every target. Per-target values live in versions/<minecraft>-<loader>/gradle.properties.
org.gradle.jvmargs=-Xmx3G
# Only configure the target(s) a command needs; otherwise every Minecraft version is set up.
org.gradle.configureondemand=true
# Acknowledges Stonecutter's suggestion to use Kotlin DSL; the loader scripts stay in Groovy.
dev.kikugie.stonecutter.hard_mode=true
# CI runs dozens of builds at once; retry failed downloads (rate limits, 5xx from Maven repositories)
# with a longer backoff (1, 2, 4, 8, 16 s) instead of failing the build.
systemProp.org.gradle.internal.repository.max.retries=5
systemProp.org.gradle.internal.repository.initial.backoff=1000

mod_version=1.4.0
mod_id=flightaffinity
mod_name=Flight Affinity
mod_group=net.baneina.flightaffinity
mod_author=Baneina
mod_license=CC0-1.0
# Shown in the mod lists (Mod Menu, the NeoForge/Forge mods screen); the first line is the summary.
mod_description=A helmet enchantment that lets you mine at full speed when you are not standing on the ground.\nMining is 5 times slower while jumping, flying, swimming or riding. Flight Affinity removes that penalty, as Aqua Affinity does for being underwater, and the two stack. Find it in the enchanting table, from librarian villagers and in loot chests. Based on the Aerial Affinity mod.
mod_homepage=https://modrinth.com/mod/flight-affinity
mod_sources=https://github.com/pauverblom/flight-affinity
mod_issues=https://github.com/pauverblom/flight-affinity/issues

modrinth_id=flight-affinity
curseforge_id=1180063

# Installers used by the production tests (gradle/production.gradle).
fabric_installer=1.1.2
quilt_installer=0.15.1

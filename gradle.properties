# Shared by every target. Per-target values live in versions/<minecraft>-<loader>/gradle.properties.
org.gradle.jvmargs=-Xmx3G
# Only configure the target(s) a command needs; otherwise every Minecraft version is set up.
org.gradle.configureondemand=true
# Acknowledges Stonecutter's suggestion to use Kotlin DSL; the loader scripts stay in Groovy.
dev.kikugie.stonecutter.hard_mode=true

mod_version=1.3.0
mod_id=flightaffinity
mod_name=Flight Affinity
mod_group=net.baneina.flightaffinity
mod_author=Baneina
mod_license=CC0-1.0
mod_description=Allows you to mine faster while in the air! Based on the original Aerial Affinity Mod, this mod adds a new enchantment which removes the speed penalty applied while mining while in the air.\nThis new enchantment is applied on helmets, and it can be obtained by villager trading, through the enchanting table or inside dungeons.
mod_homepage=https://modrinth.com/mod/flight-affinity
mod_sources=https://github.com/pauverblom/flight-affinity
mod_issues=https://github.com/pauverblom/flight-affinity/issues

modrinth_id=flight-affinity
curseforge_id=1180063


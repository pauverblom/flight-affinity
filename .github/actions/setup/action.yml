name: Set up Java and Gradle
description: JDKs 17, 21 and 25 as Gradle toolchains, and Gradle with its dependency cache.
runs:
  using: composite
  steps:
    - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: |
          17
          21
          25
    - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      with:
        # The open-source cache (GitHub Actions cache), saved by runs on the default branch. Minecraft
        # files differ for every target and are large, so only libraries and plugins are kept.
        cache-provider: basic
        gradle-home-cache-excludes: |
          caches/fabric-loom
          caches/neoformruntime
    - name: Use the installed JDKs as toolchains
      shell: bash
      run: |
        mkdir -p ~/.gradle
        echo "org.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64" >> ~/.gradle/gradle.properties
    # The Gradle wrapper does not retry its own download (services.gradle.org sometimes answers 5xx).
    - name: Download Gradle
      shell: bash
      run: |
        for attempt in 1 2 3 4 5; do
          ./gradlew --version > /dev/null && exit 0
          echo "Gradle download failed (attempt $attempt), retrying in $((attempt * 15)) s"
          sleep $((attempt * 15))
        done
        exit 1

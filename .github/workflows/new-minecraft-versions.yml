name: new-minecraft-versions

# Every Monday: looks for Minecraft releases that no jar covers yet, tries them with the existing
# jars (GameTests and production tests), pushes what works to the branch
# compat/new-minecraft-versions and opens or updates an issue per Minecraft version, assigned to the
# repository owner. GitHub emails assignees and mentioned users (Settings > Notifications >
# "Participating, @mentions and custom": Email).
# See .github/scripts/new_minecraft_versions.py.
on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:
  # Changes to the check itself: rehearse the release of 26.3 (removed from the working tree, then
  # found, added back to the jars before it and tested), without pushing a branch or opening issues.
  push:
    paths:
      - .github/scripts/new_minecraft_versions.py
      - .github/workflows/new-minecraft-versions.yml

concurrency:
  group: new-minecraft-versions
  cancel-in-progress: false

defaults:
  run:
    shell: bash

# The script hands the token only to gh and its final git push, not to Gradle (see TOKEN in the script).
permissions:
  contents: write
  issues: write
  # Starts CI on the branch it pushes (pushes made with this token start no workflows).
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Check
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/new_minecraft_versions.py check | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Rehearse
        if: github.event_name == 'push'
        run: python3 .github/scripts/new_minecraft_versions.py try --forget 26.3 | tee -a "$GITHUB_STEP_SUMMARY"

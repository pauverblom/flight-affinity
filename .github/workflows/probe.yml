# Temporary: NeoForge builds for each Minecraft version the jars declare.
name: probe
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  neoforge:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml | grep -o '<version>[^<]*' | sed 's/<version>//' > nf.txt
          for p in 20.2 20.3 20.5 21.0 21.2 21.3 21.5 21.6 21.7 21.9 26.1.0 26.1.1; do echo "$p: $(grep -E "^${p//./\\.}\." nf.txt | sort -V | tail -2 | tr '\n' ' ')"; done
          curl -sS https://maven.neoforged.net/releases/net/neoforged/forge/maven-metadata.xml | grep -o '<version>[^<]*' | sed 's/<version>//' | sort -V | tail -4

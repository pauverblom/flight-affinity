# Temporary: prints upstream version lists that are unreachable from the dev sandbox.
name: probe
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Minecraft releases
        run: curl -sS https://piston-meta.mojang.com/mc/game/version_manifest_v2.json | jq -r '.latest, (.versions[] | select(.type=="release") | .id)' | head -60 | tr '\n' ' '
      - name: NeoForge versions (latest per line)
        run: |
          curl -sS https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml | grep -o '<version>[^<]*' | sed 's/<version>//' > nf.txt
          for p in 20.2 20.4 20.6 21.0 21.1 21.3 21.4 21.5 21.8 21.10 21.11 26.1 26.2 26.3 26.4; do echo "$p: $(grep -E "^${p//./\\.}\." nf.txt | sort -V | tail -3 | tr '\n' ' ')"; done
      - name: NeoForge 1.20.1 (forge fork)
        run: curl -sS https://maven.neoforged.net/releases/net/neoforged/forge/maven-metadata.xml | grep -o '<version>[^<]*' | sed 's/<version>//' | sort -V | tail -3
      - name: Forge 1.20.1
        run: curl -sS https://maven.minecraftforge.net/net/minecraftforge/forge/maven-metadata.xml | grep -o '<version>1\.20\.1-[^<]*' | sed 's/<version>//' | sort -V | tail -3
      - name: Loom plugin markers
        run: |
          for id in fabric-loom net.fabricmc.fabric-loom net.fabricmc.fabric-loom-remap; do
            echo "$id: $(curl -sS https://maven.fabricmc.net/$(echo $id | tr . /)/$id.gradle.plugin/maven-metadata.xml | grep -o '<version>1\.1[5-9][^<]*' | sed 's/<version>//' | grep -v -i snapshot | sort -V | tail -4 | tr '\n' ' ')"
          done
      - name: Fabric loader
        run: curl -sS https://meta.fabricmc.net/v2/versions/loader | jq -r '.[0:3][] | .version'

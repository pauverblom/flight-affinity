/*
 * Modrinth + CurseForge upload for one target: ./gradlew :<target>:publishMods
 * Tokens come from MODRINTH_TOKEN / CURSEFORGE_TOKEN; without them the task is a dry run.
 * `releaseJar` is set by the loader script to the jar players actually install.
 *
 * Each jar is one upload, identified by its version number: <mod version>+mc<range>-<loader>.
 * An upload whose version number is already on Modrinth is skipped, so a release only publishes
 * what is new: every jar after a mod_version bump, or just the jars whose Minecraft range grew
 * (same mod version, see "Releasing" in CONTRIBUTING.md). The release workflow runs this for every target.
 */
apply plugin: 'me.modmuss50.mod-publish-plugin'

static String changelogFor(File file, String version) {
    if (!file.exists()) return "Release $version"
    def m = file.text =~ /(?ms)^## \[${java.util.regex.Pattern.quote(version)}\][^\n]*\n(.*?)(?=^## \[|\z)/
    return m ? (m[0][1] as String).trim() : "Release $version"
}

def loaderNames = [fabric: 'Fabric', neoforge: 'NeoForge', forge: 'Forge', quilt: 'Quilt']
// Empty when not set: the release workflow passes empty tokens on dry runs.
def modrinthToken = providers.environmentVariable('MODRINTH_TOKEN').filter { !it.isBlank() }
def curseforgeToken = providers.environmentVariable('CURSEFORGE_TOKEN').filter { !it.isBlank() }
// -Pdry_run (or missing tokens): show what would be uploaded, upload nothing.
def dryRunOnly = project.hasProperty('dry_run') || !modrinthToken.isPresent() || !curseforgeToken.isPresent()
def versionNumber = "${project.version}-${loader}".toString()
// The release workflow publishes the jar CI built and tested (-Pprebuilt_jars, see gradle/release-jars.gradle).
def publishedJar = project.hasProperty('prebuilt_jars')
        ? layout.file(provider { releaseTargetJars(project.name, 'release').singleFile })
        : releaseJar.flatMap { it.archiveFile }
def loadersPublished = [loader] + (project.findProperty('also_runs_on') ?: '').toString().split(' ').findAll()

// GET request; returns [HTTP status, body].
def httpGet = { String url, Map<String, String> headers = [:] ->
    def connection = (HttpURLConnection) new URL(url).openConnection()
    connection.setRequestProperty('User-Agent', "${mod_sources} (release workflow)")
    headers.each { name, value -> connection.setRequestProperty(name, value) }
    connection.connectTimeout = 20_000
    connection.readTimeout = 20_000
    try {
        def code = connection.responseCode
        def stream = code < 400 ? connection.inputStream : connection.errorStream
        return [code, stream?.text ?: '']
    } finally {
        connection.disconnect()
    }
}

// Whether this exact jar (version number) is already on Modrinth. Asked once, when first needed.
def modrinthHasVersion = {
    def (code, body) = httpGet("https://api.modrinth.com/v2/project/${modrinth_id}/version/${URLEncoder.encode(versionNumber, 'UTF-8')}")
    if (code == 200) return true
    if (code == 404) return false
    throw new GradleException("Modrinth answered HTTP $code when looking up $versionNumber: $body")
}.memoize()

// The upload needs Modrinth's project ID; modrinth_id in gradle.properties may be the slug from the URL.
def modrinthProjectId = {
    def (code, body) = httpGet("https://api.modrinth.com/v2/project/${modrinth_id}")
    if (code != 200) throw new GradleException("Modrinth has no project '$modrinth_id' (HTTP $code)")
    return new groovy.json.JsonSlurper().parseText(body).id as String
}.memoize()

/*
 * Modrinth's changelog page lists every version, and a release is one version per jar: only one jar
 * per release carries the changes (the jar for the newest Minecraft version); the others link to the
 * GitHub release. Each starts with the Minecraft versions and loaders it is for.
 */
def mcKey = { String v -> v.tokenize('.').collect { it as int } }
def compareMc = { String a, String b ->
    def x = mcKey(a), y = mcKey(b)
    for (i in 0..<Math.max(x.size(), y.size())) {
        def c = (x[i] ?: 0) <=> (y[i] ?: 0)
        if (c != 0) return c
    }
    return 0
}
def carriesChangelog = {
    def releases = rootProject.file('versions').listFiles().findAll { new File(it, 'gradle.properties').isFile() }.collect { dir ->
        def props = new Properties()
        new File(dir, 'gradle.properties').withInputStream { props.load(it) }
        props.getProperty('smoke_of') ? null : [name: dir.name, newest: props.getProperty('mc_targets').trim().split(/\s+/).last()]
    }.findAll()
    def chosen = releases.max { a, b -> compareMc(a.newest, b.newest) ?: b.name <=> a.name }
    return chosen.name == project.name
}
/*
 * Whether this jar only widens one already published: Modrinth has a jar of the same mod version and
 * loader for some of the same Minecraft versions (its narrower predecessor). Jars of one release are
 * uploaded side by side, but never overlap.
 */
def onlyNewMinecraftVersions = {
    if (!modrinthToken.isPresent()) return false
    def (code, body) = httpGet("https://api.modrinth.com/v2/project/${modrinth_id}/version")
    if (code != 200) throw new GradleException("Modrinth answered HTTP $code when listing versions: $body")
    return (new groovy.json.JsonSlurper().parseText(body) as List).any {
        (it.version_number as String).startsWith("${mod_version}+") && (it.loaders as List).contains(loader) &&
                !(it.game_versions as List).intersect(mcTargets).isEmpty()
    }
}
def uploadChangelog = {
    def header = "Minecraft ${mcTargets.join(', ')} on ${loadersPublished.collect { loaderNames[it] }.join(', ')}."
    def releaseUrl = "${mod_sources}/releases/tag/v${mod_version}"
    if (onlyNewMinecraftVersions()) return "$header\n\nNo changes to the mod: this file adds support for more Minecraft versions. Changes in ${mod_version}: $releaseUrl"
    if (!carriesChangelog()) return "$header\n\nChanges in ${mod_version}: $releaseUrl"
    return "$header\n\n" + changelogFor(rootProject.file('CHANGELOG.md'), mod_version as String)
}

publishMods {
    file = publishedJar
    // Modrinth/CurseForge version numbers also name the loader, so each upload's number is unique.
    version = versionNumber
    displayName = "${mod_name} ${mod_version} for ${loadersPublished.collect { loaderNames[it] }.join('/')} ${mcDisplay}"
    changelog = providers.provider { uploadChangelog() }
    type = STABLE
    dryRun = dryRunOnly

    loadersPublished.each { modLoaders.add(it) }

    modrinth {
        // Without a token (CI) the upload is a dry run; the slug keeps CI from depending on Modrinth.
        projectId = providers.provider { modrinthToken.isPresent() ? modrinthProjectId() : modrinth_id as String }
        accessToken = modrinthToken
        minecraftVersions.addAll(mcTargets)
        if (loader == 'fabric') requires('fabric-api')
    }

    curseforge {
        projectId = curseforge_id
        accessToken = curseforgeToken
        minecraftVersions.addAll(mcTargets)
        // The Java versions players run the jar on: those of its Minecraft versions (21 and 25 for a
        // 1.21.11-26.3 jar compiled for Java 21).
        mcTargets.collect { mc ->
            def props = new Properties()
            def file = rootProject.file("versions/${mc}-${loader}/gradle.properties")
            if (file.isFile()) file.withInputStream { props.load(it) }
            props.getProperty('java_version', java_version as String)
        }.unique().each { javaVersions.add(JavaVersion.toVersion(it)) }
        client = true
        server = true
        if (loader == 'fabric') requires('fabric-api')
    }
}

// Real uploads skip jars that are already published (Modrinth is the reference; both are uploaded
// together). Dry runs always run, to show what would be uploaded.
tasks.matching { it.name in ['publishModrinth', 'publishCurseforge'] }.configureEach {
    onlyIf("$versionNumber is not on Modrinth yet") { dryRunOnly || !modrinthHasVersion() }
}
// Modrinth first: if its upload fails, the build stops before CurseForge, so a re-run cannot upload
// a jar to CurseForge twice. (If CurseForge fails after Modrinth, upload that file to CurseForge by hand.)
tasks.matching { it.name == 'publishCurseforge' }.configureEach { mustRunAfter 'publishModrinth' }

// For the release workflow: the jar, its version number and whether it is already published.
tasks.register('releaseInfo') {
    group = 'publishing'
    description = 'Writes build/release-info.properties (jar, version number, already published).'
    def jarFile = publishedJar
    def output = layout.buildDirectory.file('release-info.properties')
    inputs.file(jarFile)
    outputs.file(output)
    outputs.upToDateWhen { false }
    doLast {
        def published = modrinthHasVersion()
        output.get().asFile.text = "jar=${jarFile.get().asFile.absolutePath}\nversion=$versionNumber\npublished=$published\n"
        logger.lifecycle("$versionNumber: ${published ? 'already on Modrinth' : 'not published yet'}")
    }
}

/*
 * Checks, without uploading, that a real release of this jar would be accepted: both tokens work, the
 * Modrinth project exists, and CurseForge knows every Minecraft version the jar is published for
 * (it only accepts versions it lists). The release workflow runs it on dry runs and real releases.
 */
tasks.register('checkPublishing') {
    group = 'publishing'
    description = 'Checks the Modrinth/CurseForge tokens and that CurseForge knows the Minecraft versions.'
    def minecraftVersions = mcTargets
    doLast {
        if (!modrinthToken.isPresent() || !curseforgeToken.isPresent())
            throw new GradleException('MODRINTH_TOKEN and CURSEFORGE_TOKEN must be set')
        def problems = []
        def (modrinthCode, modrinthBody) = httpGet('https://api.modrinth.com/v2/user', [Authorization: modrinthToken.get()])
        if (modrinthCode != 200) problems << "MODRINTH_TOKEN was rejected by Modrinth (HTTP $modrinthCode)"
        logger.lifecycle("Modrinth project $modrinth_id has ID ${modrinthProjectId()}")
        def (cfCode, cfBody) = httpGet('https://minecraft.curseforge.com/api/game/versions', ['X-Api-Token': curseforgeToken.get()])
        if (cfCode != 200) {
            problems << "CURSEFORGE_TOKEN was rejected by CurseForge (HTTP $cfCode)"
        } else {
            def known = (new groovy.json.JsonSlurper().parseText(cfBody) as List).collect { it.name as String } as Set
            def unknown = minecraftVersions.findAll { !known.contains(it) }
            if (unknown) problems << "CurseForge does not list Minecraft ${unknown.join(', ')} yet; its upload would be rejected"
        }
        if (problems) throw new GradleException(problems.join('\n'))
        logger.lifecycle('Modrinth and CurseForge would accept this upload')
    }
}

/*
 * Sanity checks on the jar players install, naming the problem where a production test would only
 * fail: a jar that was never remapped, metadata or translations missing, test classes included.
 */
tasks.register('checkReleaseJar') {
    group = 'verification'
    description = 'Checks the release jar contents (metadata, mixins, translations, data, no test classes).'
    def jarFile = publishedJar
    // Forge uses an event instead of the mixin (see FlightAffinityForge), and runs on SRG names.
    def expectMixin = loader != 'forge'
    def expectSrg = loader == 'forge'
    // Loom rewrites the mixin's target names directly in the class when remapping.
    def expectIntermediary = loader == 'fabric' && !mcAtLeast('26.1')
    def metadataFile = loader == 'fabric' ? 'fabric.mod.json'
            : (loader == 'neoforge' && mcAtLeast('1.20.5')) ? 'META-INF/neoforge.mods.toml' : 'META-INF/mods.toml'
    def modId = mod_id
    def expectDataDrivenEnchantment = mcAtLeast('1.21')
    def number = versionNumber
    inputs.file(jarFile)
    doLast {
        // Modrinth rejects version numbers longer than 32 characters.
        if (number.length() > 32) throw new GradleException("Version number $number is longer than Modrinth's 32 characters")
        def zip = new java.util.zip.ZipFile(jarFile.get().asFile)
        try {
            def text = { path -> def e = zip.getEntry(path as String); e == null ? null : zip.getInputStream(e).text }
            def problems = []
            if (text(metadataFile) == null) problems << "missing $metadataFile"
            if (zip.entries().toList().any { it.name.contains('/flightaffinity/test/') }) problems << 'contains test classes'
            def mixins = text("${modId}.mixins.json")
            if (expectMixin && mixins == null) problems << 'missing mixin config'
            if (!expectMixin && mixins != null) problems << 'contains a mixin config, which this loader does not use'
            if (mixins != null && mixins.contains('refmap')) problems << 'mixin config references a refmap that is not needed'
            if (expectSrg) {
                def entry = zip.getEntry('net/baneina/flightaffinity/forge/FlightAffinityForge.class')
                def bytes = entry == null ? '' : new String(zip.getInputStream(entry).bytes, 'ISO-8859-1')
                if (bytes.contains('onGround') || !(bytes =~ /m_\d+_/)) problems << 'the Forge entry point is not reobfuscated to SRG names'
            }
            // Every language must name the enchantment, under the key the game looks up
            // ("enchantment.<namespace>.<path>", also what the 1.21+ enchantment file refers to).
            def nameKey = "enchantment.${modId}.flight_affinity".toString()
            def langs = zip.entries().toList().findAll { it.name ==~ "assets/${modId}/lang/[a-z_]+\\.json" }
            if (!langs.any { it.name.endsWith('/en_us.json') }) problems << 'missing en_us translations'
            langs.each {
                def entries = new groovy.json.JsonSlurper().parseText(text(it.name)) as Map
                if (!entries[nameKey]) problems << "${it.name} has no '$nameKey'"
            }
            if (text("assets/${modId}/icon.png") == null) problems << 'missing icon'
            def enchantmentFile = text("data/${modId}/enchantment/flight_affinity.json")
            if (expectDataDrivenEnchantment) {
                if (enchantmentFile == null) problems << 'missing data-driven enchantment'
                else if ((new groovy.json.JsonSlurper().parseText(enchantmentFile) as Map).description?.translate != nameKey)
                    problems << "enchantment description is not '$nameKey'"
            } else if (enchantmentFile != null) {
                problems << 'contains a data-driven enchantment, which this Minecraft version cannot load'
            }
            if (expectIntermediary) {
                def mixin = zip.getEntry('net/baneina/flightaffinity/mixin/PlayerMixin.class')
                def bytes = mixin == null ? '' : new String(zip.getInputStream(mixin).bytes, 'ISO-8859-1')
                // Both the class references and the target strings in the annotations must be remapped.
                ['getDestroySpeed', 'onGround', 'net/minecraft/world/entity/player/Player'].each {
                    if (bytes.contains(it)) problems << "mixin still refers to the Mojang name $it"
                }
            }
            if (!problems.isEmpty()) throw new GradleException("${jarFile.get().asFile.name}: ${problems.join('; ')}")
            logger.lifecycle("${jarFile.get().asFile.name} looks good")
        } finally {
            zip.close()
        }
    }
}

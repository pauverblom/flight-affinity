/*
 * Modrinth + CurseForge upload for one target: ./gradlew :<target>:publishMods
 * Tokens come from MODRINTH_TOKEN / CURSEFORGE_TOKEN; without them the task is a dry run.
 * `releaseJar` is set by the loader script to the jar players actually install.
 */
apply plugin: 'me.modmuss50.mod-publish-plugin'

static String changelogFor(File file, String version) {
    if (!file.exists()) return "Release $version"
    def m = file.text =~ /(?ms)^## \[${java.util.regex.Pattern.quote(version)}\][^\n]*\n(.*?)(?=^## \[|\z)/
    return m ? (m[0][1] as String).trim() : "Release $version"
}

def loaderNames = [fabric: 'Fabric', neoforge: 'NeoForge', forge: 'Forge']
def modrinthToken = providers.environmentVariable('MODRINTH_TOKEN')
def curseforgeToken = providers.environmentVariable('CURSEFORGE_TOKEN')

publishMods {
    file = releaseJar.flatMap { it.archiveFile }
    // Modrinth/CurseForge version numbers also name the loader, so each upload's number is unique.
    version = "${project.version}-${loader}"
    displayName = "${mod_name} ${mod_version} for ${loaderNames[loader]} ${mcDisplay}"
    changelog = changelogFor(rootProject.file('CHANGELOG.md'), mod_version as String)
    type = STABLE
    dryRun = !modrinthToken.isPresent() || !curseforgeToken.isPresent()

    modLoaders.add(loader)
    // e.g. NeoForge for the Forge 1.20.1 jar, Quilt for Fabric jars; each has a <mc>-<loader>-<other> smoke test.
    (project.findProperty('also_runs_on') ?: '').toString().split(' ').findAll().each { modLoaders.add(it) }

    modrinth {
        projectId = modrinth_id
        accessToken = modrinthToken
        minecraftVersions.addAll(mcTargets)
        if (loader == 'fabric') requires('fabric-api')
    }

    curseforge {
        projectId = curseforge_id
        accessToken = curseforgeToken
        minecraftVersions.addAll(mcTargets)
        javaVersions.add(JavaVersion.toVersion(java_version))
        client = true
        server = true
        if (loader == 'fabric') requires('fabric-api')
    }
}

/*
 * Sanity checks on the jar players install. CI runs this because the GameTests only exercise the
 * development build: they cannot notice a jar that was never remapped or lost its mixin refmap.
 */
tasks.register('checkReleaseJar') {
    group = 'verification'
    description = 'Checks the release jar contents (metadata, mixins, translations, data, no test classes).'
    def jarFile = releaseJar.flatMap { it.archiveFile }
    def expectRefmap = loader == 'forge'
    // Loom rewrites the mixin's target names directly in the class when remapping.
    def expectIntermediary = loader == 'fabric' && !mcAtLeast('26.1')
    def metadataFile = loader == 'fabric' ? 'fabric.mod.json'
            : (loader == 'neoforge' && mcAtLeast('1.20.5')) ? 'META-INF/neoforge.mods.toml' : 'META-INF/mods.toml'
    def modId = mod_id
    def expectDataDrivenEnchantment = mcAtLeast('1.21')
    inputs.file(jarFile)
    doLast {
        def zip = new java.util.zip.ZipFile(jarFile.get().asFile)
        try {
            def text = { path -> def e = zip.getEntry(path as String); e == null ? null : zip.getInputStream(e).text }
            def problems = []
            if (text(metadataFile) == null) problems << "missing $metadataFile"
            if (zip.entries().toList().any { it.name.contains('/flightaffinity/test/') }) problems << 'contains test classes'
            def mixins = text("${modId}.mixins.json")
            if (mixins == null) problems << 'missing mixin config'
            def refmap = text("${modId}.refmap.json")
            if (expectRefmap) {
                if (refmap == null) problems << 'missing mixin refmap'
                else if (!refmap.contains('m_')) problems << "refmap has no SRG names: $refmap"
                if (mixins != null && !mixins.contains('refmap')) problems << 'mixin config does not reference the refmap'
            } else if (mixins != null && mixins.contains('refmap')) {
                problems << 'mixin config references a refmap that is not needed'
            }
            // Every language must name the enchantment, under the key the game looks up
            // ("enchantment.<namespace>.<path>", also what the 1.21+ enchantment file refers to).
            def nameKey = "enchantment.${modId}.flight_affinity".toString()
            def langs = zip.entries().toList().findAll { it.name ==~ "assets/${modId}/lang/[a-z_]+\\.json" }
            if (!langs.any { it.name.endsWith('/en_us.json') }) problems << 'missing en_us translations'
            langs.each {
                def entries = new groovy.json.JsonSlurper().parseText(text(it.name)) as Map
                if (!entries[nameKey]) problems << "${it.name} has no '$nameKey'"
            }
            if (text("assets/${modId}/icon.png") == null) problems << 'missing icon'
            def enchantmentFile = text("data/${modId}/enchantment/flight_affinity.json")
            if (expectDataDrivenEnchantment) {
                if (enchantmentFile == null) problems << 'missing data-driven enchantment'
                else if ((new groovy.json.JsonSlurper().parseText(enchantmentFile) as Map).description?.translate != nameKey)
                    problems << "enchantment description is not '$nameKey'"
            } else if (enchantmentFile != null) {
                problems << 'contains a data-driven enchantment, which this Minecraft version cannot load'
            }
            if (expectIntermediary) {
                def mixin = zip.getEntry('net/baneina/flightaffinity/mixin/PlayerMixin.class')
                def bytes = mixin == null ? '' : new String(zip.getInputStream(mixin).bytes, 'ISO-8859-1')
                // Both the class references and the target strings in the annotations must be remapped.
                ['getDestroySpeed', 'onGround', 'net/minecraft/world/entity/player/Player'].each {
                    if (bytes.contains(it)) problems << "mixin still refers to the Mojang name $it"
                }
            }
            if (!problems.isEmpty()) throw new GradleException("${jarFile.get().asFile.name}: ${problems.join('; ')}")
            logger.lifecycle("${jarFile.get().asFile.name} looks good")
        } finally {
            zip.close()
        }
    }
}

/*
 * Smoke test on a NeoForge server installed by NeoForge's own installer, for the NeoForge versions
 * ModDevGradle cannot set up (20.2, 20.3 and 20.5 publish no ModDevGradle bundle). Enabled by
 * production_server=true in versions/<target>/gradle.properties.
 *
 * Nothing is compiled here: the mods folder gets the release jar of `smoke_of` and that target's
 * GameTests packaged as a mod (testModJar), and the server runs them as a GameTest server
 * (-Dneoforge.gameTestServer). The tests register themselves on such a server; see NeoForgeTestMod.
 */
apply plugin: 'base'
apply plugin: 'jvm-toolchains'

def smokeOf = project.property('smoke_of') as String
evaluationDependsOn(":$smokeOf")
def release = project(":$smokeOf")

def neoforge = project.neoforge as String
def serverDir = file('run/gametest')
def argsFile = "libraries/net/neoforged/neoforge/$neoforge/unix_args.txt"
def serverJava = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(project.java_version as int) }

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

configurations {
    neoForgeInstaller { transitive = false }
}
dependencies {
    neoForgeInstaller "net.neoforged:neoforge:$neoforge:installer"
}

def installServer = tasks.register('installServer', Exec) {
    description = "Installs a NeoForge $neoforge server into run/gametest."
    def installer = configurations.neoForgeInstaller
    inputs.files(installer)
    outputs.file(new File(serverDir, argsFile))
    workingDir serverDir
    doFirst {
        serverDir.mkdirs()
        executable serverJava.get().executablePath.asFile.absolutePath
        args '-jar', installer.singleFile.absolutePath, '--installServer', serverDir.absolutePath
    }
}

def installMods = tasks.register('installMods', Sync) {
    description = "Installs the ${smokeOf} jar and its GameTests into run/gametest/mods."
    from(release.releaseJar)
    from(release.tasks.named('testModJar'))
    into(new File(serverDir, 'mods'))
}

tasks.register('runGametest', Exec) {
    group = 'verification'
    description = "Runs the GameTests on a NeoForge $neoforge server with the ${smokeOf} jar."
    dependsOn installServer, installMods
    workingDir serverDir
    // A GameTest server whose tests never start keeps running; fail instead.
    timeout = java.time.Duration.ofMinutes(15)
    doFirst {
        new File(serverDir, 'eula.txt').text = 'eula=true\n'
        executable serverJava.get().executablePath.asFile.absolutePath
        args '-Dneoforge.gameTestServer=true', "@$argsFile", 'nogui'
    }
}

/*
 * Shared configuration for every target, applied by build.<loader>.gradle.
 * A target is "<minecraft>-<loader>[-<other loader>]"; its versions/<target>/gradle.properties
 * provides java_version, the loader dependency versions and either mc_targets (a release target)
 * or smoke_of (a smoke test of another target's jar). See settings.gradle.kts.
 */

def nameParts = project.name.split('-')
ext.loader = nameParts[1]
// Loader the game runs on; differs only for "<mc>-forge-neoforge" (Forge 1.20.1 code on NeoForge 1.20.1).
ext.runtimeLoader = nameParts.length > 2 ? nameParts[2] : loader
ext.minecraft = stonecutter.current.version as String
ext.mcAtLeast = { String v -> stonecutter.eval(minecraft, ">=$v".toString()) }

ext.smokeOf = project.findProperty('smoke_of') as String
ext.isSmoke = smokeOf != null

// Minecraft versions this jar is published for, oldest first.
ext.mcTargets = isSmoke ? [minecraft] : (project.property('mc_targets') as String).trim().split(/\s+/) as List<String>
ext.mcMin = mcTargets.first()
ext.mcMax = mcTargets.last()
ext.mcDisplay = mcMin == mcMax ? mcMin : "$mcMin-$mcMax"

// Jar names read <mod>-<loader>-<version>+mc<first>-<last>, e.g.
// flightaffinity-neoforge-1.3.0+mc1.20.2-1.20.4.jar works on 1.20.2, 1.20.3 and 1.20.4.
version = "${mod_version}+mc${mcDisplay}"
group = mod_group
base.archivesName = "${mod_id}-${loader}"

repositories {
    mavenCentral()
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version as int
}

// Loader-specific classes live in packages named after their loader.
def otherLoaders = ['fabric', 'neoforge', 'forge'] - loader
// Whole files that only exist for some Minecraft versions (smaller differences use //? comments).
def versionedSources = [
        '**/enchantment/FlightAffinityEnchantment.java': '<1.21',
        '**/test/LegacyFluids.java'                    : '<1.20.5',
]
sourceSets.configureEach {
    java {
        otherLoaders.each { exclude "**/flightaffinity/$it/**", "**/flightaffinity/test/$it/**" }
        versionedSources.each { pattern, predicate -> if (!stonecutter.eval(minecraft, predicate)) exclude pattern }
    }
}

/*
 * Metadata is generated from the values above, so the version ranges in fabric.mod.json,
 * mods.toml and the Modrinth/CurseForge uploads always agree.
 */
static String neoForgeVersionFor(String mc) {
    // 1.21.1 -> 21.1, 1.20.2 -> 20.2, 26.1.2 -> 26.1.2
    def parts = mc.split(/\./)
    return parts[0] == '1' ? "${parts[1]}.${parts.length > 2 ? parts[2] : '0'}" : mc
}

def metadata = [
        mod_id         : mod_id,
        mod_name       : mod_name,
        mod_version    : project.version,
        mod_author     : mod_author,
        mod_license    : mod_license,
        mod_description: mod_description,
        mod_description_json: (mod_description as String).replace('\\', '\\\\').replace('"', '\\"').replace('\n', '\\n'),
        mod_homepage   : mod_homepage,
        mod_sources    : mod_sources,
        mod_issues     : mod_issues,
        java_version   : java_version,
        loader         : loader,
        // Forge 1.20.1 reobfuscates through a mixin refmap; Loom remaps mixins without one.
        refmap         : loader == 'forge',
        mixin_compat   : mcAtLeast('1.20.5') ? 'JAVA_21' : 'JAVA_17',
        pack_format    : project.findProperty('pack_format') ?: '',
        fabric_mc_range: mcMin == mcMax ? mcMin : ">=$mcMin <=$mcMax",
        fabric_loader  : project.findProperty('fabric_loader_min') ?: '',
        maven_mc_range : mcMin == mcMax ? "[$mcMin]" : "[$mcMin,$mcMax]",
        loader_dep     : loader == 'forge' ? 'forge' : 'neoforge',
        loader_range   : loader == 'forge' ? '[47,)' : "[${neoForgeVersionFor(mcMin)},)",
        // Dependencies: Forge and NeoForge before 20.4 (FancyModLoader 1.x) require `mandatory`; later
        // NeoForge uses `type` and, in development, rejects `mandatory` unless `type` is also present.
        dep_mandatory  : loader == 'forge' || (loader == 'neoforge' && !mcAtLeast('1.20.5')),
        dep_type       : loader == 'neoforge',
        test_entrypoint: mcAtLeast('1.21.5') ? 'main' : 'fabric-gametest',
]

def templates = ['fabric.mod.json', 'META-INF/mods.toml', '*.mixins.json', 'pack.mcmeta']

tasks.withType(ProcessResources).configureEach {
    inputs.properties(metadata)
    filesMatching(templates) { expand(metadata) }

    if (loader != 'fabric') exclude 'fabric.mod.json'
    if (loader == 'fabric') exclude 'META-INF/mods.toml'
    if (loader == 'neoforge' && mcAtLeast('1.20.5')) {
        filesMatching('META-INF/mods.toml') { path = 'META-INF/neoforge.mods.toml' }
    }
    if (!project.hasProperty('pack_format')) exclude 'pack.mcmeta'

    // Enchantments became data-driven in 1.21; before that the enchantment is registered in code.
    if (!mcAtLeast('1.21')) exclude 'data/*/enchantment/**', 'data/minecraft/tags/enchantment/**'

    // GameTest structures: data/<ns>/structures before 1.21, data/<ns>/structure until 1.21.5,
    // after which tests are declared as test_instance files and need no structure.
    if (mcAtLeast('1.21')) exclude 'data/*/structures/**'
    if (!mcAtLeast('1.21') || mcAtLeast('1.21.5')) exclude 'data/*/structure/**'
    if (!mcAtLeast('1.21.5')) exclude 'data/*/test_instance/**'
}

/*
 * Smoke tests: compile only the GameTests (for this target's Minecraft version) and run them with
 * the release jar of `smoke_of` installed in the game's mods folder, the way a player installs it.
 * Forge-on-NeoForge builds from source instead: it is the same Minecraft version, only another loader.
 */
if (isSmoke && runtimeLoader == loader) {
    evaluationDependsOn(":$smokeOf")
    def release = project(":$smokeOf")

    sourceSets.main {
        java.exclude '**/*'
        resources.exclude '**/*'
    }
    // The tests refer to the mod's classes; compile them against the release target's development jar.
    dependencies { testCompileOnly files(release.tasks.named('jar')) }

    def installTestedJar = tasks.register('installTestedJar', Sync) {
        description = "Installs the ${smokeOf} jar into run/gametest/mods."
        from(release.releaseJar)
        into(file('run/gametest/mods'))
    }
    tasks.matching { it.name == 'runGametest' }.configureEach { dependsOn installTestedJar }
}

// The GameTests packaged as a mod, for smoke tests on installed servers (gradle/production-smoke.gradle).
tasks.register('testModJar', Jar) {
    description = 'Packages the GameTests as a mod jar.'
    archiveClassifier = 'testmod'
    from sourceSets.test.output
}

// There are no JUnit tests: the tests are GameTests, run with runGametest.
tasks.named('test') { enabled = false }

tasks.withType(Jar).configureEach {
    from(rootProject.file('LICENSE')) { rename { "LICENSE_${mod_id}" } }
}

tasks.named('jar', Jar) {
    manifest.attributes(
            'Implementation-Title': mod_name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': mod_author,
            'Built-On-Minecraft': minecraft,
    )
}

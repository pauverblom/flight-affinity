import net.darkhax.curseforgegradle.TaskPublishCurseForge

plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    testImplementation "net.fabricmc:fabric-loader-junit:${fabric_loader_version}"
    testImplementation "org.junit.jupiter:junit-jupiter-api:5.10.0"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.10.0"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        configureEach {
            ideConfigFolder = 'Fabric'
            appendProjectPathToConfigName = false
        }
        gametest {
            server()
            setConfigName('Fabric GameTest Server')
            ideConfigGenerated(true)
            source sourceSets.test
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get()}/gametest-report.xml"
            runDir('runs/gametest')
        }
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        clientTesting {
            client()
            setConfigName('Fabric Client (Testing)')
            ideConfigGenerated(true)
            runDir('runs/client_testing')
            source sourceSets.test
            vmArg "-Dfabric-api.gametest"
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
        serverTesting {
            server()
            setConfigName('Fabric Server (Testing)')
            ideConfigGenerated(true)
            runDir('runs/server_testing')
            source sourceSets.test
            vmArg "-Dfabric-api.gametest"
        }
    }
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}

sourceSets.test.java.srcDir project(':common').file('src/test/java')
sourceSets.test.resources.srcDir project(':common').file('src/test/resources')

tasks.withType(Test).configureEach {
    failFast = false
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

plugins.apply("com.modrinth.minotaur")

modrinth {
    token = System.getenv("MODRINTH_TOKEN") // Remember to have MODRINTH_TOKEN set in your environment
    projectId = mod_id // Make sure your Modrinth project ID is configured
    versionNumber = project.version
    versionType = "release"
    uploadFile = tasks.named("jar")
    gameVersions = [minecraft_version]
    loaders = ["fabric", "quilt"]
}

plugins.apply("net.darkhax.curseforgegradle")

tasks.register("publishCurseForge", TaskPublishCurseForge) {
    apiToken = System.getenv("CURSEFORGE_TOKEN") // Remember to have CURSEFORGE_TOKEN set in your environment

    // El Project ID de CurseForge es un número
    def projectId = "YOUR_CURSEFORGE_PROJECT_ID"

    // Solo registrar la subida si el ID existe y no es el placeholder
    if (projectId != "YOUR_CURSEFORGE_PROJECT_ID") {
        def mainFile = upload(projectId, tasks.named("jar").get().archiveFile)
        mainFile.changelog = "Release ${project.version}"
        mainFile.releaseType = "release"
        mainFile.addGameVersion(minecraft_version)
        mainFile.addModLoader("Fabric", "Quilt")
    } else {
        doFirst {
            println "Warning: CurseForge Project ID is not set for Fabric!"
        }
    }
}

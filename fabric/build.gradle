import net.darkhax.curseforgegradle.TaskPublishCurseForge

plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

// Detect whether we are building for 1.21.5+ (registry-based tests) or pre-1.21.5 (annotation-based tests)
def mcVersionParts = minecraft_version.split('\\.')
def is1215OrNewer = false
if (mcVersionParts.length >= 2) {
    def major = mcVersionParts[0].toInteger()
    def minor = mcVersionParts[1].toInteger()
    def patch = mcVersionParts.length >= 3 ? mcVersionParts[2].toInteger() : 0
    if (major > 1 || (major == 1 && minor > 21) || (major == 1 && minor == 21 && patch >= 5)) {
        is1215OrNewer = true
    }
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    testImplementation "net.fabricmc:fabric-loader-junit:${fabric_loader_version}"
    testImplementation "org.junit.jupiter:junit-jupiter-api:5.10.0"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.10.0"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }

    runs {
        configureEach {
            ideConfigFolder = 'Fabric'
            appendProjectPathToConfigName = false
        }
        gametest {
            server()
            setConfigName('Fabric GameTest Server')
            ideConfigGenerated(true)
            source sourceSets.test
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get()}/gametest-report.xml"
            runDir('runs/gametest')
        }
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        clientTesting {
            client()
            setConfigName('Fabric Client (Testing)')
            ideConfigGenerated(true)
            runDir('runs/client_testing')
            source sourceSets.test
            vmArg "-Dfabric-api.gametest"
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
        serverTesting {
            server()
            setConfigName('Fabric Server (Testing)')
            ideConfigGenerated(true)
            runDir('runs/server_testing')
            source sourceSets.test
            vmArg "-Dfabric-api.gametest"
        }
    }
}

tasks.named('remapJar') {
    archiveFileName = "${mod_id}-${version}+mc${minecraft_version_display}-${project.name}.jar"
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}

sourceSets.test.java.srcDirs = is1215OrNewer
        ? [file('src/test/java'), project(':common').file('src/test/java')]
        : [file('src/test/java_pre_1.21.5'), project(':common').file('src/test/java_pre_1.21.5')]
sourceSets.test.resources.srcDirs = is1215OrNewer
        ? [file('src/test/resources')]
        : [file('src/test/resources_pre_1.21.5')]

tasks.withType(Test).configureEach {
    failFast = false
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

plugins.apply("com.modrinth.minotaur")

modrinth {
    token = env.fetch("MODRINTH_TOKEN", System.getenv("MODRINTH_TOKEN") ?: "")
    projectId = "flight-affinity"
    versionNumber = "${project.version}+mc${minecraft_version_display}"
    versionName = "Flight Affinity ${project.version} for Fabric ${minecraft_version_display}"
    versionType = "release"
    changelog = extractChangelog(project.version)
    uploadFile = tasks.named("jar")
    gameVersions = ["1.21", "1.21.1", "1.21.2", "1.21.3", "1.21.4", "1.21.5", "1.21.6", "1.21.7", "1.21.8"]
    loaders = ["fabric", "quilt"]
}

plugins.apply("net.darkhax.curseforgegradle")

tasks.register("publishCurseForge", TaskPublishCurseForge) {
    apiToken = env.fetch("CURSEFORGE_TOKEN", System.getenv("CURSEFORGE_TOKEN") ?: "")

    def mainFile = upload("1180063", tasks.named("jar").get().archiveFile)
    mainFile.displayName = "Flight Affinity ${project.version} for Fabric ${minecraft_version_display}"
    mainFile.changelog = extractChangelog(project.version)
    mainFile.releaseType = "release"
    mainFile.addGameVersion("1.21")
    mainFile.addGameVersion("1.21.1")
    mainFile.addGameVersion("1.21.2")
    mainFile.addGameVersion("1.21.3")
    mainFile.addGameVersion("1.21.4")
    mainFile.addGameVersion("1.21.5")
    mainFile.addGameVersion("1.21.6")
    mainFile.addGameVersion("1.21.7")
    mainFile.addGameVersion("1.21.8")
    mainFile.addModLoader("Fabric", "Quilt")
}

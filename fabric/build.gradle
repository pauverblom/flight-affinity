import net.darkhax.curseforgegradle.TaskPublishCurseForge

plugins {
    id 'multiloader-loader'
    id 'fabric-loom' version '1.6-SNAPSHOT'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    testImplementation "net.fabricmc:fabric-loader-junit:${fabric_loader_version}"
    testImplementation "org.junit.jupiter:junit-jupiter-api:5.10.0"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.10.0"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

loom {
    def aw = project(":common").file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        configureEach {
            appendProjectPathToConfigName.set(false)
        }
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("runs/client")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("runs/server")
        }
        gametest {
            server()
            setConfigName("Fabric GameTest Server")
            ideConfigGenerated(true)
            source sourceSets.test
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get()}/gametest-report.xml"
            runDir("runs/gametest")
        }
        client_testing {
            client()
            setConfigName("Fabric Client (Testing)")
            ideConfigGenerated(true)
            source sourceSets.test
            runDir("runs/client_testing")
        }
        server_testing {
            server()
            setConfigName("Fabric Server (Testing)")
            ideConfigGenerated(true)
            source sourceSets.test
            runDir("runs/server_testing")
        }
    }
}

tasks.named('remapJar') {
    archiveFileName = "${mod_id}-${version}+mc${minecraft_version_display}-${project.name}.jar"
}

// Use standard test source directories for this 1.20.4 backport
sourceSets.test.java.srcDirs = [file('src/test/java'), project(':common').file('src/test/java')]
sourceSets.test.resources.srcDirs = [file('src/test/resources')]

tasks.withType(Test).configureEach {
    failFast = false
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

// --sun-misc-unsafe-memory-access=allow is only valid on Java 23+; strip it when running on Java 21.
tasks.withType(JavaExec).configureEach {
    doFirst {
        setJvmArgs(jvmArgs.findAll { !it.contains("sun-misc-unsafe-memory-access") })
    }
}

plugins.apply("com.modrinth.minotaur")

modrinth {
    token = env.fetch("MODRINTH_TOKEN", System.getenv("MODRINTH_TOKEN") ?: "")
    projectId = "flight-affinity"
    versionNumber = "${project.version}+mc${minecraft_version_display}"
    versionName = "Flight Affinity ${project.version} for Fabric ${minecraft_version_display}"
    versionType = "release"
    changelog = extractChangelog(project.version)
    uploadFile = tasks.named("jar")
    gameVersions = ["1.20", "1.20.1", "1.20.2", "1.20.3", "1.20.4"]
    loaders = ["fabric", "quilt"]
}

plugins.apply("net.darkhax.curseforgegradle")

tasks.register("publishCurseForge", TaskPublishCurseForge) {
    apiToken = env.fetch("CURSEFORGE_TOKEN", System.getenv("CURSEFORGE_TOKEN") ?: "")

    def mainFile = upload("1180063", tasks.named("jar").get().archiveFile)
    mainFile.displayName = "Flight Affinity ${project.version} for Fabric ${minecraft_version_display}"
    mainFile.changelog = extractChangelog(project.version)
    mainFile.releaseType = "release"
    mainFile.addGameVersion("1.20")
    mainFile.addGameVersion("1.20.1")
    mainFile.addGameVersion("1.20.2")
    mainFile.addGameVersion("1.20.3")
    mainFile.addGameVersion("1.20.4")
    mainFile.addModLoader("Fabric", "Quilt")
}

// Loom 1.6 does not support ideConfigFolder. Post-process the generated IntelliJ run
// configuration XMLs to inject folderName="Fabric" so they appear grouped.
tasks.matching { it.name == 'ideaSyncTask' }.configureEach {
    doLast {
        def runConfigsDir = rootProject.file('.idea/runConfigurations')
        if (!runConfigsDir.exists()) return

        def fabricConfigNames = ['Fabric_Client', 'Fabric_Server', 'Fabric_GameTest_Server',
                                 'Fabric_Client__Testing_', 'Fabric_Server__Testing_']
        runConfigsDir.eachFileMatch(~/.+\.xml/) { File xmlFile ->
            def baseName = xmlFile.name.replaceFirst(/\.xml$/, '')
            if (fabricConfigNames.any { baseName.startsWith(it) }) {
                def text = xmlFile.text
                if (!text.contains('folderName=')) {
                    text = text.replace('<configuration default="false"',
                                        '<configuration default="false" folderName="Fabric"')
                    xmlFile.text = text
                }
            }
        }
    }
}


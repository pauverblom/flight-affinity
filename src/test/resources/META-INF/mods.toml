[[dependencies.flightaffinity_test]]
modId = "${mod_id}"
<% if (legacy_toml) { %>mandatory = true<% } else { %>type = "required"<% } %>
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"

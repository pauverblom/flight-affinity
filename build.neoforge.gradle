// NeoForge targets (1.20.2+). NeoForge runs on Mojang names, so the jar is not remapped.
plugins {
    id 'net.neoforged.moddev'
}

apply from: rootProject.file('gradle/common.gradle')

neoForge {
    version = project.neoforge

    runs {
        client { client() }
        server { server() }
        gametest {
            type = 'gameTestServer'
            sourceSet = sourceSets.test
            systemProperty 'neoforge.enabledGameTestNamespaces', 'flightaffinity-test'
            gameDirectory = project.file('run/gametest')
        }
    }

    // GameTests live in the test source set and need Minecraft on their classpath.
    addModdingDependenciesTo sourceSets.test

    mods {
        // A smoke test loads the mod from the release jar in run/gametest/mods instead.
        if (!isSmoke || runtimeLoader != loader) {
            "${mod_id}" { sourceSet sourceSets.main }
        }
        // The GameTests are a separate mod, as on Fabric.
        flightaffinity_test { sourceSet sourceSets.test }
    }
}

ext.releaseJar = tasks.named('jar')
if (!isSmoke) apply from: rootProject.file('gradle/publish.gradle')

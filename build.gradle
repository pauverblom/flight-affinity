import org.jetbrains.gradle.ext.JUnit

plugins {
    // see https://fabricmc.net/develop/ for new versions
    id 'fabric-loom' version '1.15.5' apply false
    // see https://projects.neoforged.net/neoforged/moddevgradle for new versions
    id 'net.neoforged.moddev' version '2.0.141' apply false
    id "com.modrinth.minotaur" version "2.8.7" apply false
    id "net.darkhax.curseforgegradle" version "1.1.25" apply false
    id "co.uzzu.dotenv.gradle" version "4.0.0"
    // Allows configuring IntelliJ run-configuration defaults from Gradle (e.g. default JVM args for JUnit).
    id "org.jetbrains.gradle.plugin.idea-ext" version "1.1.7"
}

// ── IntelliJ run-configuration defaults ─────────────────────────────────────
// common/src/test/java is a shared source-root in both the :fabric and
// :neoforge IDE modules. IntelliJ therefore merges both modules' dependency
// classpaths when running any test from that directory, putting
// fabric-loader-junit on every test classpath.
// fabric-loader-junit registers FabricLoaderLauncherSessionListener as a JUnit
// LauncherSessionListener SPI; when instantiated it calls Knot.<clinit> which
// calls LoaderUtil.verifyClasspath(), which throws when it finds three
// different ASM versions on the (merged) classpath.
//
// Setting fabric.classPathGroups to any non-null value causes
// LoaderUtil.verifyClasspath() to return immediately (it assumes the developer
// is managing class-path groups deliberately), which prevents the crash.
// This is safe for both Fabric and NeoForge test runs because the check is
// only a sanity guard and the actual class loading is unaffected.
idea.project.settings {
    runConfigurations {
        defaults(JUnit) {
            vmParameters = '-ea -Dfabric.classPathGroups=skip'
        }
    }
}

/**
 * Runs all tests in the correct order:
 *   1. :common:test       – fast JUnit logic tests (no Minecraft)
 *   2. :fabric:runGametest  – Fabric headless GameTest server
 *   3. :neoforge:runGametest – NeoForge headless GameTest server
 *
 * Usage: ./gradlew testAll
 */
tasks.register("testAll") {
    group = "verification"
    description = "Runs JUnit logic tests and in-game GameTests for both Fabric and NeoForge."
    dependsOn(":common:test", ":fabric:runGametest", ":neoforge:runGametest")
}

// Enforce sequential execution so the Minecraft servers don't race each other
// and logic tests are validated first.
gradle.projectsEvaluated {
    project(":fabric").tasks.named("runGametest") {
        mustRunAfter(":common:test")
    }
    project(":neoforge").tasks.named("runGametest") {
        mustRunAfter(":fabric:runGametest")
    }
}

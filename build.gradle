plugins {
    // Required for NeoGradle
    id "org.jetbrains.gradle.plugin.idea-ext" version "1.1.7"
    id "com.modrinth.minotaur" version "2.8.7" apply false
    id "net.darkhax.curseforgegradle" version "1.1.25" apply false
    id "co.uzzu.dotenv.gradle" version "4.0.0"
}

// NeoGradle (userdev) registers run configurations via idea-ext automatically.
// They appear as "Neoforge: Client", "Neoforge: Server", etc.
// Note: idea-ext 1.1.7 does not support folderName or renaming run configurations,
// so NeoForge runs cannot be grouped into a folder from Gradle alone.

// The NeoForm manifest for 1.20.6 references lwjgl-freetype-3.3.3-natives-macos-patch
// which was never published to Maven Central or NeoForge Maven.
// This stub Maven repository provides an empty placeholder JAR so neoFormRecompile
// can resolve the configuration on macOS without failing.
allprojects {
    repositories {
        maven {
            name = 'LWJGL stub (macOS natives-patch)'
            url = uri("${rootProject.projectDir}/gradle/stubs")
        }
    }
}

/**
 * Runs all tests in the correct order:
 *   1. :common:test       – fast JUnit logic tests (no Minecraft)
 *   2. :fabric:runGametest  – Fabric headless GameTest server
 *   3. :neoforge:runGameTestServer – NeoForge headless GameTest server
 *
 * Usage: ./gradlew testAll
 */
tasks.register("testAll") {
    group = "verification"
    description = "Runs JUnit logic tests and in-game GameTests for both Fabric and NeoForge."
    dependsOn(":common:test", ":fabric:runGametest", ":neoforge:runGameTestServer")
}

// Enforce sequential execution so the Minecraft servers don't race each other
// and logic tests are validated first.
gradle.projectsEvaluated {
    project(":fabric").tasks.named("runGametest") {
        mustRunAfter(":common:test")
    }
    project(":neoforge").tasks.named("runGameTestServer") {
        mustRunAfter(":fabric:runGametest")
    }
}

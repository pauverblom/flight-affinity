// Forge 1.20.1 (the published jar also declares NeoForge 1.20.1, which is a Forge 47 fork).
plugins {
    id 'net.neoforged.moddev.legacyforge'
}

apply from: rootProject.file('gradle/common.gradle')

legacyForge {
    if (runtimeLoader == 'neoforge') {
        // NeoForge for 1.20.1 is a fork of Forge 47 and runs the same code.
        enable { it.neoForgeVersion = project.neoforge }
    } else {
        version = "${minecraft}-${project.forge}"
    }

    runs {
        client { client() }
        server { server() }
        gametest {
            type = 'gameTestServer'
            sourceSet = sourceSets.test
            systemProperty 'forge.enabledGameTestNamespaces', 'flightaffinity-test'
            gameDirectory = project.file('run/gametest')
        }
    }

    // GameTests live in the test source set and need Minecraft on their classpath.
    addModdingDependenciesTo sourceSets.test

    mods {
        // A smoke test loads the mod from the release jar in run/gametest/mods instead.
        if (!isSmoke || runtimeLoader != loader) {
            "${mod_id}" { sourceSet sourceSets.main }
        }
        // The GameTests are a separate mod, as on Fabric.
        flightaffinity_test { sourceSet sourceSets.test }
    }
}

// The jar users install: reobfuscated to SRG names.
ext.releaseJar = tasks.named('reobfJar')
// The GameTests as a mod for production servers, reobfuscated like the release jar.
tasks.named('testModJar', Jar) {
    archiveClassifier = 'testmod-dev'
    destinationDirectory = layout.buildDirectory.dir('devlibs')
}
// (obfuscation.reobfuscate() only supports the main source set: it also rewires its publication.)
ext.productionTestJar = tasks.register('reobfTestModJar', net.neoforged.moddevgradle.legacyforge.tasks.RemapJar) {
    description = 'Reobfuscates the GameTests mod jar to SRG names.'
    def testJar = tasks.named('testModJar', Jar)
    input = testJar.flatMap { it.archiveFile }
    archiveBaseName = testJar.flatMap { it.archiveBaseName }
    archiveVersion = testJar.flatMap { it.archiveVersion }
    archiveClassifier = 'testmod'
    libraries.from(sourceSets.test.compileClasspath)
    obfuscation.configureNamedToSrgOperation(remapOperation)
}
if (!isSmoke) apply from: rootProject.file('gradle/publish.gradle')
apply from: rootProject.file('gradle/production.gradle')

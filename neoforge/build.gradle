import net.darkhax.curseforgegradle.TaskPublishCurseForge

plugins {
    id 'multiloader-loader'
    id 'net.neoforged.gradle.userdev' version '7.0.107'
}

// Automatically enable neoforge AccessTransformers if the file exists
// This location is hardcoded in FML and can not be changed.
// https://github.com/neoforged/FancyModLoader/blob/a952595eaaddd571fbc53f43847680b00894e0c1/loader/src/main/java/net/neoforged/fml/loading/moddiscovery/ModFile.java#L118
def at = file('src/main/resources/META-INF/accesstransformer.cfg')
if (at.exists()) {
    minecraft.accessTransformers.file at
}

runs {
    configureEach {
        modSource project.sourceSets.main
    }
    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }
    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        programArgument '--nogui'
    }
    gameTestServer {
        modSource project.sourceSets.test
        systemProperty 'neoforge.enabledGameTestNamespaces', "${mod_id}-test"
    }
    data {
        programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
    clientTesting {
        configure 'client'
        modSource project.sourceSets.test
        systemProperty 'neoforge.enabledGameTestNamespaces', "${mod_id}-test"
        systemProperty 'neoforge.enableGameTest', 'true'
    }
    serverTesting {
        configure 'server'
        modSource project.sourceSets.test
        systemProperty 'neoforge.enabledGameTestNamespaces', "${mod_id}-test"
        programArgument '--nogui'
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// Fix duplicate ASM modules in legacy classpath files.
// Minecraft 1.20.4 ships ASM 9.5 and NeoForge ships 9.8; both end up in the legacy
// classpath but the ignoreList only covers 9.8. The 9.5 jars leak through as named
// modules and conflict with the 9.8 jars on the module path, causing a
// ResolutionException at BootstrapLauncher startup.
// This strips the 9.5 entries from all classpath.txt files under neoForm steps.
Closure stripAsm95FromClasspaths = {
    project.fileTree('build/neoForm') {
        include '**/steps/writeMinecraftClasspath*/classpath.txt'
    }.each { File cpFile ->
        if (cpFile.length() > 0) {
            def lines = cpFile.readLines()
            def filtered = lines.findAll { !(it.contains('/org.ow2.asm/') && it.contains('/9.5/')) }
            def removed = lines.size() - filtered.size()
            if (removed > 0) {
                cpFile.text = filtered.join('\n')
                logger.lifecycle("Stripped ${removed} duplicate ASM 9.5 entries from ${cpFile.name}")
            }
        }
    }
}

// Strip after each writeMinecraftClasspath task generates its classpath file.
tasks.configureEach { task ->
    if (task.name.startsWith('writeMinecraftClasspath')) {
        task.doLast { stripAsm95FromClasspaths() }
    }
}

// Also strip whenever `classes` finishes — this covers IntelliJ before-run (ideBeforeRun
// depends on classes) so the game always gets a clean classpath even if
// writeMinecraftClasspath didn't re-run in this build invocation.
tasks.named('classes').configure {
    doLast { stripAsm95FromClasspaths() }
}

dependencies {
    implementation "net.neoforged:neoforge:${neoforge_version}"

    testImplementation sourceSets.main.output
    testImplementation "org.junit.jupiter:junit-jupiter-api:5.10.0"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.10.0"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

configurations {
    testCompileClasspath.extendsFrom compileClasspath
    testRuntimeClasspath.extendsFrom runtimeClasspath
}

// Use standard test source directories for this 1.20.4 backport
sourceSets.test.java.srcDirs = [file('src/test/java'), project(':common').file('src/test/java')]
sourceSets.test.resources.srcDirs = [file('src/test/resources')]

plugins.apply("com.modrinth.minotaur")

modrinth {
    token = env.fetch("MODRINTH_TOKEN", System.getenv("MODRINTH_TOKEN") ?: "")
    projectId = "flight-affinity"
    versionNumber = "${project.version}+mc${minecraft_version_display}"
    versionName = "Flight Affinity ${project.version} for NeoForge ${minecraft_version_display}"
    versionType = "release"
    changelog = extractChangelog(project.version)
    uploadFile = tasks.named("jar")
    gameVersions = ["1.20.2", "1.20.3", "1.20.4"]
    loaders = ["neoforge"]
}

plugins.apply("net.darkhax.curseforgegradle")

tasks.register("publishCurseForge", TaskPublishCurseForge) {
    apiToken = env.fetch("CURSEFORGE_TOKEN", System.getenv("CURSEFORGE_TOKEN") ?: "")

    def mainFile = upload("1180063", tasks.named("jar").get().archiveFile)
    mainFile.displayName = "Flight Affinity ${project.version} for NeoForge ${minecraft_version_display}"
    mainFile.changelog = extractChangelog(project.version)
    mainFile.releaseType = "release"
    mainFile.addGameVersion("1.20.2")
    mainFile.addGameVersion("1.20.3")
    mainFile.addGameVersion("1.20.4")
    mainFile.addModLoader("NeoForge")
}

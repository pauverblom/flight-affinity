import net.darkhax.curseforgegradle.TaskPublishCurseForge

plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

// Detect whether we are building for 1.21.5+ (registry-based tests) or pre-1.21.5 (annotation-based tests)
def mcVersionParts = minecraft_version.split('\\.')
def is1215OrNewer = false
if (mcVersionParts.length >= 2) {
    def major = mcVersionParts[0].toInteger()
    def minor = mcVersionParts[1].toInteger()
    def patch = mcVersionParts.length >= 3 ? mcVersionParts[2].toInteger() : 0
    if (major > 1 || (major == 1 && minor > 21) || (major == 1 && minor == 21 && patch >= 5)) {
        is1215OrNewer = true
    }
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', "${mod_id},${mod_id}-test")
            ideName = "NeoForge ${it.name.capitalize()}"
            ideFolderName = "NeoForge"
        }
        client {
            client()
            gameDirectory = this.mkdir(this.file("runs/client"))
        }
        data {
            clientData()
            gameDirectory = this.mkdir(this.file("runs/data"))
            // DataGen can be run by - "./gradlew :neoforge:runData" in Terminal.
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        server {
            server()
            this.file("runs/server").createParentDirectories()
            gameDirectory = this.mkdir(this.file("runs/server"))
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.test
        }
    }
    runs {
        clientTesting {
            client()
            ideName = "NeoForge Client (Testing)"
            gameDirectory = this.mkdir(this.file("runs/client_testing"))
            sourceSet = sourceSets.main
            loadedMods = [ project.neoForge.mods.named(project.mod_id).get() ]
        }
        serverTesting {
            server()
            ideName = "NeoForge Server (Testing)"
            this.file("runs/server_testing").createParentDirectories()
            gameDirectory = this.mkdir(this.file("runs/server_testing"))
            sourceSet = sourceSets.main
            loadedMods = [ project.neoForge.mods.named(project.mod_id).get() ]
        }
        gametest {
            type = "gameTestServer"
            this.file("runs/gametest").createParentDirectories()
            gameDirectory = this.mkdir(this.file("runs/gametest"))
            systemProperty 'neoforge.enabledGameTestNamespaces', "${mod_id}-test"
            loadedMods = [ project.neoForge.mods.named(project.mod_id).get() ]
            sourceSet = sourceSets.test
        }
    }
}

dependencies {
    testImplementation sourceSets.main.output
    testImplementation "org.junit.jupiter:junit-jupiter-api:5.10.0"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.10.0"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

configurations {
    testCompileClasspath.extendsFrom compileClasspath
    testRuntimeClasspath.extendsFrom runtimeClasspath
    testCompileClasspath.extendsFrom modCompileClasspath
    testRuntimeClasspath.extendsFrom modRuntimeClasspath
}

sourceSets.main.resources { srcDir 'src/generated/resources' }
sourceSets.test.java.srcDirs = is1215OrNewer
        ? [file('src/test/java'), project(':common').file('src/test/java')]
        : [file('src/test/java_pre_1.21.5'), project(':common').file('src/test/java_pre_1.21.5')]
// For pre-1.21.5, the annotation-based framework does not use test_instance data files.
if (is1215OrNewer) {
    sourceSets.test.resources.srcDir project(':common').file('src/test/resources')
} else {
    sourceSets.test.resources.srcDirs = []
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'neoforge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName, it.getTaskName(null, 'jarJar')].each { variant ->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'neoforge')
            }
        }
    }
}

plugins.apply("com.modrinth.minotaur")

modrinth {
    token = env.fetch("MODRINTH_TOKEN", System.getenv("MODRINTH_TOKEN") ?: "")
    projectId = "flight-affinity"
    versionNumber = "${project.version}+mc${minecraft_version_display}"
    versionName = "Flight Affinity ${project.version} for NeoForge ${minecraft_version_display}"
    versionType = "release"
    changelog = extractChangelog(project.version)
    uploadFile = tasks.named("jar")
    gameVersions = ["1.21", "1.21.1", "1.21.2", "1.21.3", "1.21.4", "1.21.5", "1.21.6", "1.21.7", "1.21.8"]
    loaders = ["neoforge"]
}

plugins.apply("net.darkhax.curseforgegradle")

tasks.register("publishCurseForge", TaskPublishCurseForge) {
    apiToken = env.fetch("CURSEFORGE_TOKEN", System.getenv("CURSEFORGE_TOKEN") ?: "")

    def mainFile = upload("1180063", tasks.named("jar").get().archiveFile)
    mainFile.displayName = "Flight Affinity ${project.version} for NeoForge ${minecraft_version_display}"
    mainFile.changelog = extractChangelog(project.version)
    mainFile.releaseType = "release"
    mainFile.addGameVersion("1.21")
    mainFile.addGameVersion("1.21.1")
    mainFile.addGameVersion("1.21.2")
    mainFile.addGameVersion("1.21.3")
    mainFile.addGameVersion("1.21.4")
    mainFile.addGameVersion("1.21.5")
    mainFile.addGameVersion("1.21.6")
    mainFile.addGameVersion("1.21.7")
    mainFile.addGameVersion("1.21.8")
    mainFile.addModLoader("NeoForge")
}
